
name: Check APK Versions

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt

      - name: Download APKs and extract versionCode
        run: |
          set -e

          mkdir -p versions

          download_and_extract() {
            NAME="$1"
            URL="$2"

            echo "Downloading $NAME..."

            curl -fL --retry 3 "$URL" -o "/tmp/$NAME.apk"

            VERSION_CODE=$(aapt dump badging "/tmp/$NAME.apk" \
              | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" \
              | head -n 1)

            if [ -z "$VERSION_CODE" ]; then
              echo "Failed to extract versionCode from $NAME"
              exit 1
            fi

            echo "$VERSION_CODE" > "versions/$NAME.txt"

            echo "$NAME versionCode: $VERSION_CODE"
          }

          download_and_extract "cbt" \
            "https://cbt.blackrussian.games/launcher.apk"

          download_and_extract "cbt2" \
            "https://cbt2.blackrussian.games/launcher.apk"

          download_and_extract "release" \
            "https://dl.blackcdn.me/launcher.apk"

      - name: Commit version files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add versions/

          if ! git diff --cached --quiet; then
            git commit -m "Update APK version codes"
            git push
          else
            echo "Versions have not changed"
          fi
